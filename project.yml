name: RunBot
options:
  bundleIdPrefix: dev.eonist
  createIntermediateGroups: true

packages:
  RunBot:
    path: .
  GitHubClient:
    path: Packages/GitHubClient
  MenuBarKit:
    path: Packages/MenuBarKit
  AppUpdater:
    url: https://github.com/runbot-hq/AppUpdater
    branch: main
  MarkdownKit:
    url: https://github.com/runbot-hq/MarkdownKit
    branch: main

targets:
  RunBot:
    type: application
    platform: macOS
    # Xcode derives LSMinimumSystemVersion in the built Info.plist from this
    # deployment target. Do not add a conflicting literal value to
    # Resources/Info.plist; the removed 13.0 value was stale and did not
    # represent the application's actual platform requirements.
    deploymentTarget: "26.0"
    sources:
      - path: Sources/RunBot
        excludes:
          # Excluded here to avoid duplicate membership in Copy Bundle Resources.
          # Assets.xcassets is declared explicitly below with buildPhase: resources
          # so XcodeGen assigns it to exactly one resource build phase.
          # Verify with: grep -c 'Assets.xcassets.*Resources' RunBot.xcodeproj/project.pbxproj
          - Resources/Assets.xcassets
      # buildPhase: resources places these in Copy Bundle Resources.
      # XcodeGen routes .icns to a plain copy and .xcassets through actool,
      # producing Contents/Resources/AppIcon.icns and Contents/Resources/Assets.car.
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Sources/RunBot/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: RunBot
        product: RunBotCore
      - package: GitHubClient
        product: GitHubClient
      - package: MenuBarKit
        product: MenuBarKit
      - package: AppUpdater
        product: AppUpdater
      - package: MarkdownKit
        product: MarkdownKit
    settings:
      base:
        # Production identity invariant:
        # main's legacy release build copied Resources/Info.plist directly into
        # RunBot.app, and that plist already used io.github.runbot-hq. The old
        # dev.eonist.runbot value here affected Xcode-generated builds only and
        # was stale. Keep this aligned with CFBundleIdentifier in Info.plist;
        # changing it back would change the identity of Xcode-built releases.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.runbot-hq
        MACH_O_TYPE: mh_execute
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        INFOPLIST_FILE: Resources/Info.plist
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
        # LSUIElement makes the app a menu bar agent (no Dock icon) in production.
        # It lives here as a build setting rather than in Info.plist so that it
        # is only applied to the RunBot app target. The RunBotUITests target
        # has its own generated plist and never inherits this key, meaning the app
        # launches as a normal foreground process during UI tests and app.windows
        # is fully visible to XCTest.
        # ❌ NEVER move this back into Resources/Info.plist.
        INFOPLIST_KEY_LSUIElement: YES

  RunBotUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Tests/RunBotUITests
    # CRITICAL: NO dependencies on RunBot here.
    # On Xcode 26, any target-level dependency from a bundle.ui-testing target
    # to an app target causes xcodebuild to auto-inject XCTTargetAppPath with
    # the .app extension stripped -> "bundle ID couldn't be read" fatal error.
    # The app is built in a separate xcodebuild step (see ui-tests.yml).
    # The test code uses XCUIApplication(bundleIdentifier:) + Launch Services
    # to locate the already-built .app at runtime.
    settings:
      base:
        # This identifies the XCTest runner bundle, not the RunBot application.
        # RunBotUITests launches the app explicitly using io.github.runbot-hq.
        # The test-runner identifier is independent and does not control app
        # preferences, Keychain access, URL-scheme registration, or updates.
        PRODUCT_BUNDLE_IDENTIFIER: dev.eonist.runbot.uitests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        GENERATE_INFOPLIST_FILE: YES
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64

schemes:
  RunBot:
    build:
      targets:
        RunBot: all
    run:
      config: Debug

  # Dedicated UI test scheme.
  # CRITICAL: no testTargetApp key and RunBotUITests has no target dependency
  # on RunBot. Both together prevent Xcode 26 from auto-injecting
  # XCTTargetAppPath (which strips .app and breaks bundle ID lookup).
  # The RunBot app is built via a separate xcodebuild build step first.
  RunBotUITests:
    build:
      targets:
        RunBotUITests: [build, testing]
    test:
      targets:
        - name: RunBotUITests
          parallelizable: false
      environmentVariables:
        UI_TESTING: "1"
