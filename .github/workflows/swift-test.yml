name: Swift Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Swift Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        # We use branch-pinned references (e.g. @v4) intentionally. We own or
        # trust these upstream repos and pin to a stable major tag for ease of
        # maintenance. Bumping SHA pins on every upstream patch release creates
        # churn with zero security benefit for repos we control or vet directly.
        uses: actions/checkout@v4

      - name: Clear SPM cache
        # Clear both the macOS and Linux cache paths.
        # macOS runners: ~/Library/Caches/org.swift.swiftpm
        # Linux runners: ~/.cache/org.swift.swiftpm
        # Without this, SPM resolves branch-tracked deps (branch: "main") to
        # whatever commit was cached from the previous run instead of fetching
        # the current HEAD — causing "no member 'x'" errors when a dependency
        # adds a new API between runs.
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/.cache/org.swift.swiftpm

      - name: Run tests
        run: swift test
