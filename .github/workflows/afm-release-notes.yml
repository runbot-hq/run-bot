name: AFM Release Notes

on:
  # release: [published] intentionally disabled until wired into publish.yml.
  # Re-enable once the Log outputs step is replaced with a real release-body write.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to generate release notes for
        required: true

permissions:
  contents: read

jobs:
  generate-notes:
    runs-on: [self-hosted, macOS, apple-intelligence]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: runbot-hq/afm-release-notes-action@v1
        id: notes
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          # TODO: remove debug before wiring into publish.yml — verbose on every release
          debug: 'true'

      - name: Log outputs
        env:
          RELEASE_TITLE: ${{ steps.notes.outputs.release_title }}
          PREV_TAG: ${{ steps.notes.outputs.prev_tag }}
          RELEASE_BODY: ${{ steps.notes.outputs.release_body }}
        run: |
          echo "release_title=$RELEASE_TITLE"
          echo "prev_tag=$PREV_TAG"
          echo "--- release_body ---"
          echo "$RELEASE_BODY"
