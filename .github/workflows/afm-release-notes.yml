name: AFM Release Notes

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to generate release notes for
        required: true

permissions:
  contents: read

jobs:
  generate-notes:
    runs-on: [self-hosted, macOS, apple-intelligence]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: runbot-hq/afm-release-notes-action@main
        id: notes
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          debug: 'true'

      - name: Log outputs
        run: |
          echo "release_title=${{ steps.notes.outputs.release_title }}"
          echo "prev_tag=${{ steps.notes.outputs.prev_tag }}"
          echo "--- release_body ---"
          cat <<'EOF'
          ${{ steps.notes.outputs.release_body }}
          EOF
