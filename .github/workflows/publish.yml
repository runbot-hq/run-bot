# Triggered via workflow_dispatch from any branch.
# Use: gh workflow run publish.yml --ref main \
#        --field branch=<source-branch> \
#        --field channel=beta \
#        --field dry_run=false
#
# Note: --ref controls which branch the workflow YAML is read from (always main).
#       --field branch= controls which branch is actually checked out and built.
#       To release from a feature branch, keep --ref main and set --field branch=<your-branch>.
#       To release from main (default), --field branch= can be omitted.
#
# UI note: when triggering via the GitHub Actions UI, the "Use workflow from"
#       branch selector controls --ref (which YAML is read) and must stay on main.
#       The source branch is set via the "Branch" input field, not the selector.
#       Selecting a feature branch in the dropdown will read that branch's publish.yml,
#       which may not have this feature — always leave the selector on main.
#
# Responsibilities:
#   1. Compute the next semver tag from git history.
#   2. Duplicate-tag guard.
#   3. Patch Info.plist with the computed version + incremented build number.
#   4. Build + zip via build.sh.
#   5. Verify the zip contains RunBot.app/Contents/MacOS/RunBot.
#   6. Sign release zip with Ed25519 (RunBot.zip.sig).
#   7. Commit patched Info.plist back to the source branch via rebase + push (skipped on dry_run).
#   8. Tag the plist commit SHA directly — race-free (skipped on dry_run).
#   9. Upload build artifacts so the release job can consume them.
#  10. Generate AFM release notes on self-hosted runner (skipped on dry_run / manual notes).
#  11. Create GitHub Release with release_notes if provided, --generate-notes otherwise (skipped on dry_run).

name: Publish

on:
  workflow_dispatch:
    inputs:
      branch:
        # The branch to check out, build, and release from.
        # Defaults to main for normal stable releases.
        # Any branch with repo write access can be used — this is intentional:
        # beta releases from feature branches are a first-class use case.
        # workflow_dispatch itself requires repo write access, so only
        # collaborators can trigger this; it is not an open attack surface.
        # If you want to enforce that stable/release channel can only run
        # from main, add a job-level if: condition — it is a deliberate
        # omission here, not an oversight. See docs/RELEASING.md.
        description: "Branch to release from"
        required: false
        default: "main"
        type: string
      channel:
        description: "Release channel"
        required: true
        default: "beta"
        type: choice
        options:
          - "beta"
          - "release"
      dry_run:
        description: "Dry run (skip plist commit, tag, and release creation)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      release_notes:
        description: "Release notes (markdown). Leave blank to auto-generate from commits."
        required: false
        default: ""
        type: string

# cancel-in-progress: true is intentional and safe here.
#
# The duplicate-tag guard (step 2) runs *before* any mutating steps, so a
# cancelled run has not yet pushed a tag or committed the plist in the common
# case. The only narrow window where partial state could exist is if a run is
# cancelled after "Commit patched Info.plist" but before "Tag and push". In
# that case the source branch will have a version bump commit with no tag.
# Recovery:
#   git revert HEAD --no-edit && git push origin <branch>
# then re-run the workflow. See docs/RELEASING.md § Rollback procedure.
#
# TAG-NAMESPACE COLLISION RISK (accepted — not an oversight, see below):
# The group key includes inputs.branch so that parallel beta runs from
# *different* branches do not cancel each other. A side-effect is that two
# runs from different branches that happen to compute the same next tag
# (e.g. v0.7.3-beta.1) can race past the non-atomic duplicate-tag guard.
# The safe failure mode is: one run's `git push origin $TAG` will be rejected
# by the remote with "already exists" — loud, non-destructive, re-runnable.
# No silent corruption is possible. The duplicate-tag guard catches the case
# where both runs compute the same tag and one has already pushed it before
# the other reaches that step. This risk is accepted in preference to a global
# serialisation lock, which would block all parallel beta runs.
# Recovery: re-trigger the failed run from the branch that lost the race.
# See docs/RELEASING.md § Tag-namespace collision recovery.
#
# INJECTION NOTE: ${{ inputs.branch }} appears inline here. This is NOT a
# script-injection risk. concurrency.group is a workflow-level expression
# field evaluated by the GitHub Actions engine before any runner or shell
# process starts. The value is used only to compute a string key — it never
# enters a bash process and cannot execute shell commands. This is in
# contrast to run: blocks, where inline ${{ }} interpolation of user input
# IS dangerous (see env: usage in Commit patched Info.plist and Create
# GitHub Release steps).
concurrency:
  group: publish-${{ inputs.branch }}-${{ inputs.channel }}  # branch-scoped: parallel betas OK, see collision note above
  cancel-in-progress: true

# contents: write is the minimum permission required for this workflow:
#   - tag push (Tag and push step) requires contents: write
#   - plist commit push (Commit patched Info.plist step) requires contents: write
# GitHub Actions only supports permission scoping at job level, not step level.
# There is no supported mechanism to grant contents: write to specific steps only.
# Narrowing further (e.g. contents: read) would break the tag push and plist
# commit push steps. No other permissions (issues, pull-requests, etc.) are
# granted — this is already as tightly scoped as the Actions permission model allows.
permissions:
  contents: write

jobs:
  publish:
    # macos-26 is a GitHub-hosted runner (macOS 26 / Tahoe beta).
    # Build, sign, plist commit, and tagging all happen here.
    # AFM release notes and gh release create run in the separate `release` job
    # on the self-hosted runner (Apple Intelligence required).
    #
    # TRUST MODEL: workflow_dispatch requires repo write access. Any person who
    # can trigger this workflow can already push to the repo directly. Checking
    # out an arbitrary branch does not expand the trust boundary — build.sh and
    # all other scripts are checked into the same repo the dispatcher already
    # has write access to. This is not an untrusted-code execution scenario.
    # Do not add a branch allowlist unless the trust model changes (e.g. if
    # this workflow is ever made triggerable by external contributors).
    runs-on: macos-26
    # Self-hosted runner outage would otherwise queue this job indefinitely.
    # 30 minutes is generous for a build that normally completes in ~3 minutes.
    timeout-minutes: 30

    outputs:
      tag:      ${{ steps.tag.outputs.tag }}
      version:  ${{ steps.tag.outputs.version }}
      channel:  ${{ steps.tag.outputs.channel }}
      zip_path: ${{ steps.verify.outputs.zip_path }}
      sig_path: ${{ steps.sign.outputs.sig_path }}

    # STABLE-FROM-ANY-BRANCH (intentional): there is no job-level guard restricting
    # channel=release to branch=main. This is a deliberate omission — the release
    # workflow intentionally supports stable releases from feature branches (e.g. a
    # hotfix branch). workflow_dispatch already requires repo write access; anyone who
    # can trigger this can push to main directly. The trust boundary is not expanded.
    # If you want to add a main-only guard for stable releases, add:
    #   if: ${{ inputs.channel != 'release' || inputs.branch == 'main' }}
    # at job level. See docs/RELEASING.md § Triggering a release.
    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────────
      # INJECTION NOTE: ref: ${{ inputs.branch }} is a with: field on a uses: step.
      # with: fields are evaluated by the GitHub Actions engine, not by a shell.
      # The value is passed to the action (actions/checkout) as a typed input —
      # it never enters a bash process and cannot execute shell commands. This is
      # safe for user-supplied input. Compare with run: blocks, where inline
      # ${{ inputs.branch }} would be a script-injection risk.
      #
      # PRIVILEGE BOUNDARY NOTE: checking out an arbitrary branch does not create
      # an untrusted-code execution risk here. workflow_dispatch requires repo write
      # access; build.sh is checked into the same repo the dispatcher already has
      # write access to. There is no privilege escalation path. If this workflow
      # were ever made triggerable by external contributors (e.g. pull_request_target),
      # this assessment would need to be revisited.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # full history + all tags required for tag computation
          ref: ${{ inputs.branch }}

      # ── Configure git identity ─────────────────────────────────────────────────────
      # Set once here so Commit patched Info.plist and Tag and push both inherit it.
      # Previously this was duplicated in each mutating step — identical content, but
      # duplication means a future edit to one copy can silently diverge from the other.
      # git config is repo-scoped (not global), so it only affects this workspace.
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Clear SPM cache ────────────────────────────────────────────────────────────
      # WHY: SPM's source-checkout cache must be cleared to guarantee fresh
      # resolution of branch-pinned dependencies (e.g. branch: "main",
      # branch: "fix/...") on every run.
      #
      # ~/Library/Caches/org.swift.swiftpm — the source checkout cache (macOS).
      # SPM resolves branch-pinned deps to HEAD here. Stale entries cause the
      # build to silently use an older commit of a dependency rather than the
      # actual HEAD of the branch at build time. This caused run #100 to build
      # without commit 0459ccb even though that commit was at HEAD of the fix
      # branch (fix/post-swap-verification-2193) when the run triggered.
      #
      # macOS-ONLY PATH: ~/Library/Caches/org.swift.swiftpm is correct for
      # macOS (this workflow targets macos-26 only). On Linux the equivalent
      # is ~/.cache/org.swift.swiftpm (XDG Base Directory spec). If a Linux
      # job is ever added, this step must be updated or split per-platform —
      # the macOS path will silently not exist on Linux and the rm -rf will
      # be a no-op, leaving stale cache entries in place.
      #
      # WHY ~/.swiftpm IS NOT CLEARED:
      # ~/.swiftpm contains security.lock and collection metadata. Clearing it
      # on every run adds unnecessary network round-trips to reconstruct that
      # metadata and would defeat any future package security pinning that
      # stores state there. It does not affect branch-pinned resolution.
      #
      # DO NOT add ~/Library/Caches/org.swift.swiftpm to an actions/cache
      # step — caching it re-introduces the stale-resolution problem.
      - name: Clear SPM cache
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm

      # ── Compute next tag ───────────────────────────────────────────────────────────
      #
      # Tag scheme:
      #   beta channel    → vMAJOR.MINOR.(PATCH+1)-beta.N   (e.g. v0.7.3-beta.1)
      #   release channel → vMAJOR.MINOR.PATCH              (e.g. v0.7.3)
      #
      # Beta base design — why betas use PATCH+1:
      #
      #   By the semver spec (https://semver.org/#spec-item-9), a pre-release
      #   version has LOWER precedence than the associated normal version:
      #
      #     v0.7.2-beta.1  <  v0.7.2
      #
      #   This means betas tagged against the current stable base are semver-older
      #   than the stable release they follow. Any semver-aware tool — including
      #   our own UpdateChecker — will never offer them as an update to a user
      #   already on stable.
      #
      #   Using PATCH+1 as the beta base fixes this:
      #
      #     v0.7.3-beta.1  >  v0.7.2   (correct — beta users are ahead)
      #
      #   Stable users not receiving beta updates is enforced by the update
      #   channel preference in UpdateChecker, not by semver precedence.
      #
      # Algorithm:
      #   1. Find the latest stable tag (vX.Y.Z, no pre-release suffix).
      #   2. Determine channel from input.
      #   3. Beta:   compute BETA_BASE = MAJOR.MINOR.(PATCH+1), find the highest
      #              existing beta.N for that base and increment N
      #              (or start at beta.1 if none exist).
      #   4. Stable: bump PATCH by 1 (with rollover at 10).
      #
      # Rollover logic: when PATCH reaches 9 it rolls over to 0 and MINOR
      # increments; when MINOR reaches 9 it rolls over to 0 and MAJOR
      # increments. Rollover is intentional per the project convention
      # documented in docs/RELEASING.md.
      - name: Compute next tag
        id: tag
        run: |
          set -euo pipefail

          CHANNEL="${{ inputs.channel }}"

          # Latest stable tag (ignore beta/rc tags)
          LATEST_STABLE=$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)

          if [[ -z "$LATEST_STABLE" ]]; then
            # ⚠️  SEED VERSION — only reached on a pristine repo with no stable
            # tags (e.g. first-ever run or after manually deleting all tags).
            # If you see this message in CI output on an established repo,
            # something has gone wrong with tag fetching — stop and investigate.
            LATEST_STABLE="v0.7.0"
            echo "⚠️  WARNING: No stable tags found — using seed version ${LATEST_STABLE}." >&2
            echo "⚠️  If this is not a first-run on a fresh repo, tag fetching may have failed." >&2
          fi

          BASE="${LATEST_STABLE#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          # Compute PATCH+1 with rollover (shared by both channels).
          NEW_PATCH=$(( PATCH + 1 ))
          if (( NEW_PATCH > 9 )); then  # rollover: intentional, see docs/RELEASING.md
            NEW_PATCH=0
            NEW_MINOR=$(( MINOR + 1 ))
            if (( NEW_MINOR > 9 )); then  # rollover: intentional
              NEW_MINOR=0
              NEW_MAJOR=$(( MAJOR + 1 ))
            else
              NEW_MAJOR=$MAJOR
            fi
          else
            NEW_MINOR=$MINOR
            NEW_MAJOR=$MAJOR
          fi

          NEXT_BASE="${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"

          if [[ "$CHANNEL" == "beta" ]]; then
            # Beta base is PATCH+1 — pre-releases of the next version, not the
            # current stable. This ensures semver precedence is correct:
            #   v0.7.3-beta.1  >  v0.7.2  (beta users are ahead of stable)
            #
            # HIGHEST_N scans only tags under NEXT_BASE (e.g. v0.7.3-beta.*).
            # Any legacy beta tags from before this scheme (e.g. v0.7.2-beta.*)
            # will not be matched — this is intentional. Those tags lived under
            # a different base and are not part of the current beta sequence.
            # NEXT_N correctly resets to 1 for the new base; there is no
            # collision risk because the bases are different.
            HIGHEST_N=$(git tag --list "v${NEXT_BASE}-beta.*" \
              | grep -oE 'beta\.[0-9]+$' \
              | grep -oE '[0-9]+$' \
              | sort -n | tail -1 || true)
            if [[ -z "$HIGHEST_N" ]]; then
              NEXT_N=1
            else
              NEXT_N=$(( HIGHEST_N + 1 ))
            fi
            TAG="v${NEXT_BASE}-beta.${NEXT_N}"
            VERSION="${NEXT_BASE}-beta.${NEXT_N}"
          else
            TAG="v${NEXT_BASE}"
            VERSION="${NEXT_BASE}"
          fi

          echo "channel=$CHANNEL"   >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "Computed tag: $TAG (channel: $CHANNEL)"

      # ── Duplicate-tag guard ──────────────────────────────────────────────────────────
      - name: Guard against duplicate tag
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "error: tag $TAG already exists on origin. Aborting." >&2
            exit 1
          fi
          echo "Tag $TAG is available."

      # ── Patch Info.plist ──────────────────────────────────────────────────────────────
      #
      # FIX #2199: CFBundleShortVersionString is set to the FULL VERSION string
      # (including pre-release suffix) for beta builds. Previously it was always
      # stripped to the numeric core (SHORT_VERSION="${VERSION%%-*}"), which caused
      # AppUpdater's post-swap verifier to always fail for beta installs:
      #   expected: 0.7.8-beta.1  (from the GitHub release tag)
      #   got:      0.7.8         (from CFBundleShortVersionString in the installed bundle)
      # See: https://github.com/runbot-hq/run-bot/issues/2199
      #
      # Key semantics after this fix:
      #   CFBundleShortVersionString  ← full VERSION for beta (e.g. "0.7.8-beta.1")
      #                                 numeric-only for release (e.g. "0.7.8")
      #                                 AppUpdater reads this key for post-swap verification.
      #                                 macOS does NOT require this to be numeric-only;
      #                                 the pre-release suffix is displayed correctly
      #                                 in About dialogs and System Information.
      #   RBVersionString             ← full VERSION always (e.g. "0.7.8-beta.1")
      #                                 read by UpdateChecker.checkForUpdate for update
      #                                 selection. Both keys are now in sync for beta.
      #   CFBundleVersion             ← monotonically incrementing build number derived
      #                                 from total git commit count.
      #
      # BUILD is captured before the plist commit step adds one more commit,
      # so CFBundleVersion at the tagged commit will be N while git rev-list
      # returns N+1 at that tag. This is intentional — CFBundleVersion only
      # needs to be monotonically increasing. The tag is pinned to PLIST_SHA
      # (the commit where BUILD=N was embedded), which is consistent.
      # See docs/RELEASING.md § Version scheme for full rationale.
      - name: Patch Info.plist
        run: |
          set -euo pipefail

          VERSION="${{ steps.tag.outputs.version }}"
          CHANNEL="${{ steps.tag.outputs.channel }}"
          BUILD=$(git rev-list --count HEAD)

          echo "[plist] INPUT  version=${VERSION} channel=${CHANNEL} build=${BUILD}"

          # Read current values before patching so any unexpected pre-existing
          # state is visible in CI logs.
          PRE_SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          PRE_RB=$(/usr/libexec/PlistBuddy    -c "Print :RBVersionString"            Resources/Info.plist)
          PRE_BUILD=$(/usr/libexec/PlistBuddy  -c "Print :CFBundleVersion"           Resources/Info.plist)
          echo "[plist] BEFORE CFBundleShortVersionString=${PRE_SHORT}"
          echo "[plist] BEFORE RBVersionString=${PRE_RB}"
          echo "[plist] BEFORE CFBundleVersion=${PRE_BUILD}"

          # FIX #2199: for beta builds, CFBundleShortVersionString must carry the
          # full pre-release suffix so AppUpdater's post-swap verifier matches.
          # For release builds, VERSION has no suffix, so the assignment is identical
          # to the old SHORT_VERSION="${VERSION%%-*}" behaviour.
          if [[ "$CHANNEL" == "beta" ]]; then
            SHORT_VERSION="$VERSION"         # e.g. "0.7.8-beta.1" — full semver
            echo "[plist] CHANNEL=beta  → CFBundleShortVersionString will be set to full VERSION=${VERSION} (fix #2199)"
          else
            SHORT_VERSION="${VERSION%%-*}"   # e.g. "0.7.8" — strip suffix for release
            echo "[plist] CHANNEL=release → CFBundleShortVersionString will be set to numeric core SHORT_VERSION=${SHORT_VERSION}"
          fi

          echo "[plist] PATCHING CFBundleShortVersionString → ${SHORT_VERSION}"
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleShortVersionString ${SHORT_VERSION}" \
            Resources/Info.plist

          echo "[plist] PATCHING RBVersionString → ${VERSION}"
          /usr/libexec/PlistBuddy -c \
            "Set :RBVersionString ${VERSION}" \
            Resources/Info.plist

          echo "[plist] PATCHING CFBundleVersion → ${BUILD}"
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion ${BUILD}" \
            Resources/Info.plist

          # Read back all patched keys immediately after writing to catch any
          # PlistBuddy silent failure (e.g. wrong key path, type coercion issue).
          POST_SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          POST_RB=$(/usr/libexec/PlistBuddy    -c "Print :RBVersionString"            Resources/Info.plist)
          POST_BUILD=$(/usr/libexec/PlistBuddy  -c "Print :CFBundleVersion"           Resources/Info.plist)
          echo "[plist] AFTER  CFBundleShortVersionString=${POST_SHORT}"
          echo "[plist] AFTER  RBVersionString=${POST_RB}"
          echo "[plist] AFTER  CFBundleVersion=${POST_BUILD}"

          # Explicit assertions — fail loud if any key didn't take.
          if [[ "$POST_SHORT" != "$SHORT_VERSION" ]]; then
            echo "::error::[plist] CFBundleShortVersionString mismatch after patch: expected=${SHORT_VERSION} got=${POST_SHORT}" >&2
            exit 1
          fi
          if [[ "$POST_RB" != "$VERSION" ]]; then
            echo "::error::[plist] RBVersionString mismatch after patch: expected=${VERSION} got=${POST_RB}" >&2
            exit 1
          fi
          if [[ "$POST_BUILD" != "$BUILD" ]]; then
            echo "::error::[plist] CFBundleVersion mismatch after patch: expected=${BUILD} got=${POST_BUILD}" >&2
            exit 1
          fi

          # Post-swap verifier alignment check (fix #2199) — beta only.
          # For beta, SHORT_VERSION == VERSION (full semver including pre-release
          # suffix), so this check asserts that CFBundleShortVersionString exactly
          # matches what AppUpdater will expect after stripping the leading 'v'
          # from the release tag. For release, SHORT_VERSION == VERSION (no suffix),
          # so this check is structurally equivalent to the POST_SHORT assertion
          # above and adds no additional coverage in that branch.
          EXPECTED_BY_APPUPDATER="$VERSION"   # tag without leading 'v'
          if [[ "$POST_SHORT" != "$EXPECTED_BY_APPUPDATER" ]]; then
            echo "::error::[plist] POST-SWAP VERIFIER MISMATCH PREDICTED: AppUpdater expects CFBundleShortVersionString=${EXPECTED_BY_APPUPDATER} but plist has ${POST_SHORT} — install will fail post-swap verification. This is the bug from #2199." >&2
            exit 1
          fi

          echo "[plist] ALL ASSERTIONS PASSED"
          echo "[plist] SUMMARY: channel=${CHANNEL} shortVersion=${POST_SHORT} rbVersion=${POST_RB} build=${POST_BUILD}"
          echo "[plist] SUMMARY: CFBundleShortVersionString and RBVersionString are in sync — AppUpdater post-swap verification will pass."

      # ── Build ────────────────────────────────────────────────────────────────────
      - name: Build
        run: bash build.sh "${{ steps.tag.outputs.version }}"
        env:
          CI: "true"

      # ── Verify zip ─────────────────────────────────────────────────────────────────
      - name: Verify zip
        id: verify
        run: |
          set -euo pipefail
          ZIP=$(find dist -name '*.zip' | head -1)
          if [[ -z "$ZIP" ]]; then
            echo "error: no zip found in dist/" >&2
            exit 1
          fi
          echo "Verifying $ZIP"
          if ! unzip -l "$ZIP" | grep -qE '^\s+[0-9].*\s+RunBot\.app/Contents/MacOS/RunBot$'; then
            echo "error: RunBot.app/Contents/MacOS/RunBot not found at archive root in $ZIP" >&2
            unzip -l "$ZIP" >&2
            exit 1
          fi
          echo "Zip verified: RunBot.app/Contents/MacOS/RunBot is present at archive root."

          # Read CFBundleShortVersionString from the zipped bundle's Info.plist
          # to confirm the patched plist made it into the archive.
          TMPDIR_ZIP=$(mktemp -d)
          unzip -q "$ZIP" "RunBot.app/Contents/Info.plist" -d "$TMPDIR_ZIP"
          ZIP_SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$TMPDIR_ZIP/RunBot.app/Contents/Info.plist")
          ZIP_RB=$(/usr/libexec/PlistBuddy -c "Print :RBVersionString" \
            "$TMPDIR_ZIP/RunBot.app/Contents/Info.plist")
          ZIP_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" \
            "$TMPDIR_ZIP/RunBot.app/Contents/Info.plist")
          rm -rf "$TMPDIR_ZIP"

          echo "[zip-verify] CFBundleShortVersionString=${ZIP_SHORT}"
          echo "[zip-verify] RBVersionString=${ZIP_RB}"
          echo "[zip-verify] CFBundleVersion=${ZIP_BUILD}"

          EXPECTED_VERSION="${{ steps.tag.outputs.version }}"
          EXPECTED_CHANNEL="${{ steps.tag.outputs.channel }}"

          # For beta: CFBundleShortVersionString must equal the full version (fix #2199).
          # For release: it must equal the numeric core.
          if [[ "$EXPECTED_CHANNEL" == "beta" ]]; then
            EXPECTED_SHORT="$EXPECTED_VERSION"
          else
            EXPECTED_SHORT="${EXPECTED_VERSION%%-*}"
          fi

          if [[ "$ZIP_SHORT" != "$EXPECTED_SHORT" ]]; then
            echo "::error::[zip-verify] CFBundleShortVersionString mismatch in zip: expected=${EXPECTED_SHORT} got=${ZIP_SHORT} — AppUpdater post-swap verification will fail. This is the bug from #2199." >&2
            exit 1
          fi
          if [[ "$ZIP_RB" != "$EXPECTED_VERSION" ]]; then
            echo "::error::[zip-verify] RBVersionString mismatch in zip: expected=${EXPECTED_VERSION} got=${ZIP_RB}" >&2
            exit 1
          fi

          echo "[zip-verify] ALL VERSION ASSERTIONS PASSED in zip bundle."
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"

      # ── Sign release zip with Ed25519 ─────────────────────────────────────────────────
      # Produces RunBot.zip.sig — a raw 64-byte Ed25519 signature of the zip bytes.
      # AppUpdater#46 downloads this sidecar, reads it with Data(contentsOf:) (raw bytes,
      # no decoding step), and passes it directly to
      # Curve25519.Signing.PublicKey.isValidSignature(_:for:). CryptoKit expects raw
      # 64-byte binary — not base64, not DER/PEM-wrapped. Do not base64-encode the .sig.
      # Note: issue #2002's draft signing snippet base64-encoded the output; that draft
      # was written before the AppUpdater API was finalised. The shipped API is raw Data.
      #
      # ED25519_PRIVATE_KEY must be the full PEM block (-----BEGIN PRIVATE KEY----- ...).
      # The <(echo ...) process substitution passes it to openssl without writing to disk.
      # echo is used (not printf) because echo is a bash builtin — it never forks a
      # subprocess and therefore never exposes secret material via /proc/<pid>/cmdline
      # or the process table. This is safe on both macOS and Linux when shell: bash is
      # declared (as it is here); bash's builtin echo is guaranteed, not /bin/echo.
      # openssl's PEM parser tolerates the trailing newline echo appends.
      # Do not switch to printf to "fix" this; it makes no difference and obscures intent.
      #
      # Dry-run behaviour: this step is intentionally NOT gated on dry_run != 'true'.
      # The upload step IS gated, but it consumes sig_path from this step's output —
      # if signing is skipped, the upload step has no .sig to reference. Consequence:
      # dry runs require ED25519_PRIVATE_KEY to be set; they will fail at the
      # empty-secret guard below if it isn't. This is intentional — a dry run that
      # can't sign is not a useful simulation of a real release.
      - name: Sign release zip with Ed25519
        id: sign
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::ED25519_PRIVATE_KEY secret is not set — cannot sign release" >&2
            exit 1
          fi
          # Validate PEM parseability before attempting to sign. Catches a malformed or
          # truncated secret (e.g. copied without the header/footer lines) with a clear
          # error rather than a confusing 64-byte size assertion failure later.
          # Note: for Ed25519, openssl pkey -check only verifies the key parses as valid
          # PKCS#8 PEM — it does NOT assert the key type is Ed25519 specifically. A wrong
          # key type (e.g. RSA stored by mistake) passes this guard but then fails at the
          # 64-byte size assertion below, which is the correct downstream catch.
          if ! openssl pkey -in <(echo "$ED25519_PRIVATE_KEY") -check -noout 2>/dev/null; then
            echo "::error::ED25519_PRIVATE_KEY is not a valid PEM private key — check the secret format (must be full -----BEGIN PRIVATE KEY----- block)" >&2
            exit 1
          fi
          ZIP="${{ steps.verify.outputs.zip_path }}"
          SIG="${ZIP}.sig"
          # -rawin: sign the raw file bytes with no digest wrapping (Ed25519 hashes
          # internally via SHA-512; adding an outer digest here would be wrong).
          # Output is a raw 64-byte binary signature — not base64, not PEM.
          openssl pkeyutl -sign -rawin \
            -inkey <(echo "$ED25519_PRIVATE_KEY") \
            -in "$ZIP" -out "$SIG"
          # Ed25519 signatures are always exactly 64 bytes (RFC 8032 §5.1.6).
          # Anything else means the secret is malformed (e.g. only the public half
          # was stored, or it was base64-encoded before storing).
          # BSD wc -c (macOS) pads with leading spaces; -ne in arithmetic context
          # strips them. Do not change to == (string comparison with padding fails).
          SIG_BYTES=$(wc -c < "$SIG" | tr -d ' ')
          echo "Signed: $SIG ($SIG_BYTES bytes)"
          if [[ "$SIG_BYTES" -ne 64 ]]; then
            echo "error: expected 64-byte Ed25519 signature, got $SIG_BYTES bytes — check ED25519_PRIVATE_KEY secret format (must be full PEM block)" >&2
            exit 1
          fi
          # ── Public-key mismatch guard ────────────────────────────────────────────────
          # Catches a rotation where the CI secret was updated but AppDelegate.swift
          # wasn't (or vice versa). There is exactly one source of truth: the base64
          # Public key lives here in the workflow — no source-file grep needed.
          # When rotating keys, update ED25519_PRIVATE_KEY secret AND this value together.
          COMMITTED_PUB="lECb0Xv0zTET/Biw00rTtCl/sVdbzGG4WICYlG7g/oc="
          # Derive the public key from the private key in PEM form:
          #   openssl pkey -pubout -outform DER  →  44-byte SubjectPublicKeyInfo blob
          #   tail -c 32                          →  strip the 12-byte DER header
          #                                          (fixed for Ed25519 per RFC 8410 §4)
          #   base64 | tr -d '\n'                →  single-line base64, no line wrapping
          # The 12-byte SPKI header is unconditionally fixed for Ed25519 — RFC 8410 §4
          # defines a mandatory, constant OID prefix with no optional parameters.
          # OpenSSL 3.x optional public-key params apply to X25519/X448 only, not
          # Ed25519; the DER output for Ed25519 is always exactly 44 bytes on any
          # conforming OpenSSL version. tail -c 32 is therefore stable, not fragile.
          # tr -d '\n' is POSIX and works identically on macOS (BSD) and Linux (GNU).
          # A 32-byte key encodes to 44 chars so BSD base64's default 76-char wrap
          # never triggers in practice, but the explicit strip makes the no-wrap
          # behaviour unconditional across any future key rotation or platform change.
          DERIVED_PUB=$(openssl pkey -in <(echo "$ED25519_PRIVATE_KEY") -pubout -outform DER | tail -c 32 | base64 | tr -d '\n')
          if [[ "$DERIVED_PUB" != "$COMMITTED_PUB" ]]; then
            echo "::error::ED25519_PRIVATE_KEY does not match COMMITTED_PUB in publish.yml — rotate both together" >&2
            exit 1
          fi
          # Final round-trip verification: re-derive the public key and verify the
          # signature we just produced. Uses -pubin (verifies against the public key,
          # not the private key) so this is a genuine independent check — it catches
          # a corrupt .sig output, not just a re-sign of the same input.
          openssl pkeyutl -verify -rawin -pubin \
            -inkey <(openssl pkey -in <(echo "$ED25519_PRIVATE_KEY") -pubout) \
            -in "$ZIP" -sigfile "$SIG"
          echo "Signature verified OK (public key match confirmed)."
          echo "sig_path=$SIG" >> "$GITHUB_OUTPUT"

      # ── Upload build artifacts ─────────────────────────────────────────────────────────
      # The release job runs on a different runner and cannot access the macos-26
      # workspace directly. Upload zip + sig so the release job can download them.
      # Skipped on dry_run — no release job runs in that case anyway.
      - name: Upload build artifacts
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: release-assets
          path: |
            ${{ steps.verify.outputs.zip_path }}
            ${{ steps.sign.outputs.sig_path }}
          retention-days: 1

      # ── Commit patched Info.plist back to source branch ────────────────────────────────
      # Pushes the version-bumped Info.plist back to the source branch (inputs.branch)
      # so it always has correct version strings after a release.
      #
      # [skip ci] prevents this commit from re-triggering this workflow or any
      # other workflow triggered on push to the branch (e.g. lint, tests). This is
      # intentional — a version string bump is not meaningful to test or lint.
      # Keep this in mind when adding new push-triggered workflows.
      #
      # Rebase on origin/<branch> before pushing so the plist bump commit sits on
      # top of any commits that landed during the run.
      # --force-with-lease is intentionally NOT used. The rebase-before-push already
      # ensures we are not operating on a stale ref, and omitting lease keeps the
      # logic uniform across all branch types (main and feature branches alike).
      # A concurrent push between rebase and push will cause the push to fail fast
      # with a non-fast-forward error, which is the correct safe failure mode.
      #
      # INJECTION SAFETY: BRANCH is user-supplied (inputs.branch). It is passed
      # through env: — NOT interpolated inline via ${{ }} — so the runner sets it
      # as a plain environment variable before the shell starts. Inline interpolation
      # would allow a crafted branch name to execute arbitrary shell commands.
      # BRANCH is additionally validated via git check-ref-format immediately below,
      # which rejects any value that is not a valid Git branch name before any
      # git operation runs.
      - name: Commit patched Info.plist
        if: ${{ inputs.dry_run != 'true' }}
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          # FIX: use --branch to validate $BRANCH specifically as a branch name.
          # This rejects single-level names like HEAD and edge cases like paths
          # containing .. that --normalize "refs/heads/$BRANCH" passes on some
          # Git versions. BRANCH is already routed via env: so there is no shell
          # injection risk regardless, but --branch is the stricter and more
          # semantically correct validator for this use case.
          if ! git check-ref-format --branch "$BRANCH" > /dev/null 2>&1; then
            echo "::error::inputs.branch is not a valid Git branch name: '$BRANCH'" >&2
            exit 1
          fi
          git add Resources/Info.plist
          git commit -m "chore: bump version to ${{ steps.tag.outputs.tag }} [skip ci]"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      # ── Tag + push ─────────────────────────────────────────────────────────────────
      - name: Tag and push
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          # Capture the plist commit SHA explicitly so the tag is guaranteed to
          # point at the patched plist regardless of any concurrent push to the branch.
          # CFBundleVersion=N was embedded at this commit; git rev-list at this
          # tag returns N+1 (the plist commit itself). Intentional — see Patch
          # Info.plist step comment above.
          PLIST_SHA=$(git rev-parse HEAD)
          git tag -a "$TAG" "$PLIST_SHA" -m "Release $TAG"
          git push origin "$TAG"
          echo "Pushed tag $TAG (at plist commit $PLIST_SHA)."

  # ── Release job ───────────────────────────────────────────────────────────────────────
  # Runs on the self-hosted Apple Intelligence runner — required for AFM.
  # Skipped entirely on dry_run (the publish job never uploads artifacts in that case,
  # and this job's if: condition gates it explicitly).
  release:
    needs: publish
    if: ${{ inputs.dry_run != 'true' }}
    runs-on: [self-hosted, macOS, apple-intelligence]
    timeout-minutes: 15

    steps:
      # ── Checkout (needed by afm-release-notes-action for git tag history) ─────────────
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # ── Download build artifacts from publish job ──────────────────────────────────────
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      # ── Generate AFM release notes ─────────────────────────────────────────────────────
      # Runs only when no manual release_notes were provided.
      # Falls back gracefully — if AFM fails, Create GitHub Release uses --generate-notes.
      #
      # ORDERING: Runs AFTER the publish job's Tag and push, so $TAG exists on origin
      # when afm-release-notes-action calls gh api compare/$PREV_TAG...$TAG internally.
      #
      # ⚠️⚠️⚠️  CRITICAL: KEY ORDER ON uses:-BASED STEPS  ⚠️⚠️⚠️
      #
      # On a step that has `uses:`, GitHub Actions requires that `id:` and `if:`
      # appear BEFORE `uses:` in the YAML. Placing them after causes a workflow
      # startup failure with the completely useless error:
      #
      #   "An expression was expected" at the line of `with:`, not at `id:` or `if:`.
      #
      # The error message points at the wrong line and gives no indication of the
      # real cause. It took 8+ failed runs across multiple commits to diagnose.
      #
      # Required key order for uses:-based steps (do NOT deviate from this):
      #
      #   - name: ...        ← always first
      #     id: ...          ← MUST come before uses:
      #     if: ...          ← MUST come before uses:
      #     uses: ...        ← the action reference
      #     with: ...        ← inputs to the action
      #     continue-on-error: ...\n      #
      # `run:`-based steps do NOT have this restriction — id:/if: work in any
      # order there. This constraint is specific to `uses:` steps.
      - name: Generate AFM release notes
        id: afm_notes
        if: inputs.release_notes == ''
        uses: runbot-hq/afm-release-notes-action@main
        # @main is intentional and not a policy violation:
        #   1. runbot-hq/afm-release-notes-action is a first-party action in the
        #      same org — we control both repos. A breaking change to afm-release-notes-action
        #      is a deliberate act by the same team, not a supply-chain risk.
        #   2. continue-on-error: true means a bad afm commit cannot break a release —
        #      the worst outcome is degrading to GitHub's --generate-notes fallback.
        #   3. Pinning to a SHA would create friction on every AFM update with zero
        #      safety gain given (1) and (2). docs/RELEASING.md § Pinned action SHAs
        #      applies to third-party actions only.
        with:
          tag: ${{ needs.publish.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true

      # ── Create GitHub Release ──────────────────────────────────────────────────────────
      # Uploads the zip and its Ed25519 .sig sidecar as release assets.
      # AppUpdater looks for "<assetName>.sig" at update time — both files must be present.
      #
      # Release notes priority:
      #   1. Manual release_notes input (verbatim)
      #   2. AFM-generated notes (release_body from afm_notes step)
      #   3. --generate-notes fallback (GitHub auto-generated from commits)
      #
      # INJECTION SAFETY: AFM outputs (release_title, release_body) are LLM-generated
      # and must NOT be interpolated directly into the shell script via ${{ }}.
      # They are passed through env: vars instead, which the runner sets before the
      # shell process starts — no expression expansion occurs inside the bash body.
      # MANUAL_NOTES from inputs.release_notes is workflow_dispatch user input and
      # follows the same env: pattern — the protection applies equally regardless of
      # whether content is LLM-generated or human-entered.
      # Notes content is written to a temp file to avoid all shell-quoting issues at
      # the `gh release create --notes-file` boundary (multi-line bodies with quotes,
      # backticks, or $() would break inline --notes "...").
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AFM_TITLE: ${{ steps.afm_notes.outputs.release_title }}
          AFM_BODY: ${{ steps.afm_notes.outputs.release_body }}
          MANUAL_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          # TAG/CHANNEL/ZIP/SIG use template interpolation intentionally — these are
          # trusted runner-controlled or workflow-internal values (computed tag string,
          # build artifact paths), not external or user-supplied content. They do not
          # carry injection risk. Only LLM-derived values (AFM_TITLE, AFM_BODY) and
          # raw user text (MANUAL_NOTES) are routed through env: vars above.
          TAG="${{ needs.publish.outputs.tag }}"
          CHANNEL="${{ needs.publish.outputs.channel }}"
          ZIP=$(find dist -name '*.zip' | head -1)
          SIG=$(find dist -name '*.sig' | head -1)

          FLAGS=()
          if [[ "$CHANNEL" == "beta" ]]; then
            FLAGS+=(--prerelease)
          else
            FLAGS+=(--latest)
          fi

          # Determine title — prefer AFM title, fall back to tag
          TITLE="${AFM_TITLE:-}"
          if [[ -z "$TITLE" ]]; then
            TITLE="$TAG"
          fi

          # Determine notes — priority: manual input > AFM body > --generate-notes
          # Write to a temp file so multi-line content with quotes/backticks/$() is
          # passed to gh verbatim, with no shell word-splitting or interpretation.
          NOTES_FILE=$(mktemp)
          # trap ensures NOTES_FILE is removed on any exit path — success, set -e abort,
          # or signal — so the file never leaks if gh release create fails.
          # shellcheck disable=SC2064  # intentional: $NOTES_FILE must expand NOW, not at trap time
          trap "rm -f '$NOTES_FILE'" EXIT
          if [[ -n "${MANUAL_NOTES:-}" ]]; then
            printf '%s' "$MANUAL_NOTES" > "$NOTES_FILE"
            FLAGS+=(--notes-file "$NOTES_FILE")
          elif [[ -n "${AFM_BODY:-}" ]]; then
            printf '%s' "$AFM_BODY" > "$NOTES_FILE"
            FLAGS+=(--notes-file "$NOTES_FILE")
          else
            FLAGS+=(--generate-notes)
          fi

          # --target is intentionally omitted. The tag was pinned to PLIST_SHA in
          # the Tag and push step (publish job); the tag itself is the anchor —
          # gh release create against a pre-existing tag always points at the commit
          # the tag references. Passing --target <tag> is not part of the documented
          # contract for that flag (which expects a branch or commit SHA), adds no
          # safety beyond what the tag already provides, and introduces a dependency
          # on GitHub resolving a tag ref in that field the same way as omitting it.
          # The ls-remote guard in Guard against duplicate tag confirms the tag exists
          # on origin before this step runs.
          gh release create "$TAG" \
            "$ZIP" \
            "$SIG" \
            --title "$TITLE" \
            "${FLAGS[@]}"

          echo "GitHub Release $TAG created (channel: $CHANNEL)."
