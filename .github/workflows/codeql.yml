name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '**/*.swift'
      - 'Package.swift'
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 03:00 UTC
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

jobs:
  analyze:
    name: CodeQL Analysis
    # Opt-in only: runs when commit message contains [run codeql],
    # on the weekly schedule, or via manual workflow_dispatch.
    # This prevents CodeQL from blocking the self-hosted runner on every push.
    #
    # Usage:
    #   git commit -m "fix: something [run codeql]"
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[run codeql]') ||
      contains(github.event.pull_request.head.commit.message, '[run codeql]')
    runs-on: macos-26
    permissions:
      actions: read
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CodeQL bundle
        uses: actions/cache@v4
        with:
          path: ~/.codeql/packages
          key: codeql-swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/codeql.yml') }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          # autobuild runs plain `swift build` without --arch arm64, which
          # fails on this arm64 runner because main.swift has an #error guard
          # that requires the arch to be set explicitly. Use manual mode and
          # mirror the same invocation used by build.sh.
          build-mode: manual

      # ── Resolve dependencies ───────────────────────────────────────────────
      # WHY: Resolve before building so the CodeQL extractor sees the full
      # dependency graph.  Without this step, `swift build` may use a stale
      # Package.resolved from a cached .build directory, causing the build to
      # fail when a branch-tracked dependency (e.g. AppUpdater) has evolved
      # since the cache was created.
      #
      # Package.resolved is intentionally .gitignore'd (see AGENTS.md), so
      # we cannot key the build cache on its hash.  The weekly schedule makes
      # the cache savings marginal, and the stale-checkout bug makes it
      # actively harmful — so we skip the .build cache entirely and resolve
      # fresh every time.
      - name: Resolve dependencies
        run: swift package resolve --arch arm64

      - name: Build for CodeQL
        # Must match build.sh: release config, arm64 arch.
        # -c release: consistent with production build and avoids debug-only
        #   code paths that inflate the analysis surface.
        # --arch arm64: required — the #error guard in main.swift fires if the
        #   arch is not pinned, which is exactly what broke autobuild.
        run: swift build -c release --arch arm64

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
