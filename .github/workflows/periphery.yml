name: Periphery Dead Code Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  periphery:
    name: Periphery
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        # We use branch-pinned references (e.g. @v4) intentionally. We own or
        # trust these upstream repos and pin to a stable major tag for ease of
        # maintenance. Bumping SHA pins on every upstream patch release creates
        # churn with zero security benefit for repos we control or vet directly.
        uses: actions/checkout@v4

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Run Periphery scan
        run: periphery scan
