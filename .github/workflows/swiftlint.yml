name: SwiftLint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    timeout-minutes: 15
    # Only run on PRs from this repo, not forks. Fork PRs execute arbitrary
    # code (swiftlint) on our runner — restrict to collaborators only.
    # push: events (branch=main) are always from this repo and are unaffected.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        # We use branch-pinned references (e.g. @v4) intentionally. We own or
        # trust these upstream repos and pin to a stable major tag for ease of
        # maintenance. Bumping SHA pins on every upstream patch release creates
        # churn with zero security benefit for repos we control or vet directly.
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint (RunBot)
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Run SwiftLint (GitHubClient)
        working-directory: Packages/GitHubClient
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Run SwiftLint (MenuBarKit)
        working-directory: Packages/MenuBarKit
        run: swiftlint lint --strict --reporter github-actions-logging
